spring.application.name=FamilyAdmin

# Load .env file from working directory if present (local dev only; safe in prod via optional:)
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# HikariCP — tune for Railway free tier (max 5 connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Flyway — manages schema migrations (never use ddl-auto=update in production)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Meta WhatsApp Cloud API
meta.whatsapp.token=${META_WHATSAPP_TOKEN}
meta.whatsapp.phone-number-id=${META_WHATSAPP_PHONE_NUMBER_ID}
meta.whatsapp.verify-token=${META_WHATSAPP_VERIFY_TOKEN}

# Mail (sender address)
app.mail.from=${MAIL_FROM:noreply@familyadmin.local}

# Virtual threads (Java 21) — fix SecurityContextHolder ThreadLocal issue
spring.threads.virtual.enabled=true
spring.security.strategy=MODE_INHERITABLETHREADLOCAL

# Multipart file upload limits (100MB for Paprika exports with photos)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Recipe photo auto-fetch via Unsplash (demo tier: 50 req/hour)
app.recipe.photo.auto-fetch-enabled=true
app.recipe.photo.unsplash-access-key=${UNSPLASH_ACCESS_KEY:}
app.recipe.photo.max-per-run=40

# Resend inbound email ingestion
app.inbound.email.domain=${INBOUND_EMAIL_DOMAIN:familyadmin.local}
resend.webhook.secret=${RESEND_WEBHOOK_SECRET:}

# AirLabs flight status API (1,000 free req/month — on-demand refresh only)
app.airlabs.api-key=${AIRLABS_API_KEY:}

# Sync API key — used by the Mac document sync script (X-API-Key header)
sync.api-key=${SYNC_API_KEY:}
sync.api-user=${SYNC_API_USER:frank.baier@gmx.ch}

# Ollama (local LLM for document RAG — no data leaves the server)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embedding-model=nomic-embed-text
ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen2.5:3b}
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}
yahoo.finance.base-url=${YAHOO_FINANCE_BASE_URL:https://query1.finance.yahoo.com/v8/finance/chart}
